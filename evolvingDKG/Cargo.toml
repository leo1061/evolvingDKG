[package]
name = "evolvingDKG"
version = "0.1.0"
edition = "2021"

[lib]
name = "evolvingDKG"
path = "src/lib.rs"





[dependencies]
ark-ed-on-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
rand = "0.8.5"
rand_core = "0.6.4"
anyhow = "1.0"
shamir-rs = "0.1.0"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jubjub-elgamal = "0.4.3"
dusk-jubjub = "0.15.0"
ff = "0.13.0"
group = "0.13.0"
hex = "0.4.3"
rayon = "1.8.0"
sha2 = "0.10.8"

[dev-dependencies]
tempfile = "3.6.0"


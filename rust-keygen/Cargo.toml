[package]
name = "elgamal-keygen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keygen"
path = "main.rs"

[dependencies]
ark-ed-on-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
rand = "0.8"
anyhow = "1.0"
shamir-rs = "0.1.0"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"  

